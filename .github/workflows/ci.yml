name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build は Check / Test と依存関係がないので、裏で並行して走らせる。
      # 終了コードはファイル経由で受け取り、「Wait for build」で合流する。
      - name: Start build in background
        run: |
          ( pnpm build > "${RUNNER_TEMP}/ci-build.log" 2>&1; echo $? > "${RUNNER_TEMP}/ci-build.exit" ) < /dev/null > /dev/null 2>&1 &

      - name: Check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Wait for build
        run: |
          for _ in $(seq 1 300); do
            if [ -f "${RUNNER_TEMP}/ci-build.exit" ]; then
              break
            fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/ci-build.log"
          code="$(cat "${RUNNER_TEMP}/ci-build.exit" 2>/dev/null || echo 1)"
          if [ "${code}" != "0" ]; then
            echo "::error::pnpm build failed with exit code ${code}"
            exit 1
          fi

      - name: Check generated links
        run: pnpm run check:build

      # UI の文字は見た目で示す（AGENTS.md）。許可リストに無い文字が増えたら落ちる。
      - name: Check UI text allowlist
        run: pnpm run check:ui-text

  # 主要フローを実ブラウザで確認する。サイトをローカルでビルドして配信する。
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # PR はサイトの e2e だけ（速い）。writer の e2e は main へのマージ後と手動で回す。
      - name: Run e2e
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm exec playwright test e2e/site.spec.mjs
          else
            pnpm test:e2e
          fi

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
