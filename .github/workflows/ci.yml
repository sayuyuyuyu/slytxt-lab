name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build は Check / Test と依存関係がないので、裏で並行して走らせる。
      # 終了コードはファイル経由で受け取り、「Wait for build」で合流する。
      - name: Start build in background
        run: |
          ( pnpm build > "${RUNNER_TEMP}/ci-build.log" 2>&1; echo $? > "${RUNNER_TEMP}/ci-build.exit" ) &

      - name: Check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Wait for build
        run: |
          for _ in $(seq 1 300); do
            if [ -f "${RUNNER_TEMP}/ci-build.exit" ]; then
              break
            fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/ci-build.log"
          code="$(cat "${RUNNER_TEMP}/ci-build.exit" 2>/dev/null || echo 1)"
          if [ "${code}" != "0" ]; then
            echo "::error::pnpm build failed with exit code ${code}"
            exit 1
          fi

      - name: Check generated links
        run: pnpm run check:build
