name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.14.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build は Check / Test と依存関係がないので、裏で並行して走らせる。
      # 終了コードはファイル経由で受け取り、「Wait for build」で合流する。
      - name: Start build in background
        run: |
          ( pnpm build > "${RUNNER_TEMP}/ci-build.log" 2>&1; echo $? > "${RUNNER_TEMP}/ci-build.exit" ) < /dev/null > /dev/null 2>&1 &

      - name: Check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Wait for build
        run: |
          for _ in $(seq 1 300); do
            if [ -f "${RUNNER_TEMP}/ci-build.exit" ]; then
              break
            fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/ci-build.log"
          code="$(cat "${RUNNER_TEMP}/ci-build.exit" 2>/dev/null || echo 1)"
          if [ "${code}" != "0" ]; then
            echo "::error::pnpm build failed with exit code ${code}"
            exit 1
          fi

      - name: Check generated links
        run: pnpm run check:build

  # 主要フローを実ブラウザで確認する。writer は wrangler dev（ローカル KV）で
  # 起動するため、サイト本体より重い。UI の競合（#771 / #788）はここで拾う。
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.14.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # writer はサブプロジェクト。public/ の生成に esbuild を使う。
      - name: Install writer dependencies
        run: pnpm install --frozen-lockfile
        working-directory: tools/writer-cloudflare

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e
        run: pnpm test:e2e

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
