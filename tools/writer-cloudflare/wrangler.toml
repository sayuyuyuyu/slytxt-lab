name = "slytxt-writer"
main = "src/index.mjs"
compatibility_date = "2025-06-01"

# 入口はカスタムドメイン (write.slytxt.dev) のみ。workers.dev は Cloudflare Access の
# 外にあるため無効化する。
workers_dev = false

# 本番のホスト名。デプロイ時にこのドメインへ割り当てる。
routes = [{ pattern = "write.slytxt.dev", custom_domain = true }]

# 静的ファイルは scripts/prepare-assets.mjs が public/ に用意する。
[assets]
directory = "./public"
binding = "ASSETS"

# 下書きの KV。デプロイ前に
#   npx wrangler kv namespace create slytxt-writer-drafts
# で作った ID に差し替えること（README 参照）。
[[kv_namespaces]]
binding = "DRAFTS"
id = "52a4dd63c0164774ab9ca6d0c5f3855c"
preview_id = "52a4dd63c0164774ab9ca6d0c5f3855c"

[vars]
GITHUB_OWNER = "sayuyuyuyu"
GITHUB_REPO = "slytxt-lab"

# secrets はここに書かない。デプロイ時に wrangler secret put で登録する:
#   GITHUB_TOKEN      GitHub fine-grained PAT（必須）
