name = "slytxt-writer"
main = "src/index.mjs"
compatibility_date = "2025-06-01"

# 入口はカスタムドメイン (write.slytxt.dev) のみ。workers.dev は Cloudflare Access の
# 外にあるため無効化する。
workers_dev = false

# 本番のホスト名。デプロイ時にこのドメインへ割り当てる。
routes = [{ pattern = "write.slytxt.dev", custom_domain = true }]

# 静的ファイルは scripts/prepare-assets.mjs が public/ に用意する。
[assets]
directory = "./public"
binding = "ASSETS"

# 投稿・画像の見届け（src/driver.mjs）。投稿後にタブを閉じても、CI 成功後の
# merge と後片付けがサーバー側で完了するよう、毎分 scheduled を回す。
[triggers]
crons = ["* * * * *"]

# 下書きの KV。デプロイ前に
#   npx wrangler kv namespace create slytxt-writer-drafts
# で作った ID に差し替えること（README 参照）。
[[kv_namespaces]]
binding = "DRAFTS"
id = "52a4dd63c0164774ab9ca6d0c5f3855c"
preview_id = "52a4dd63c0164774ab9ca6d0c5f3855c"

[vars]
GITHUB_OWNER = "sayuyuyuyu"
GITHUB_REPO = "slytxt-lab"
# AI 要約（OpenCode Go）の設定。エンドポイントとモデルはここで差し替えられる。
OPENCODE_GO_API_URL = "https://opencode.ai/inference/go/openai/v1/chat/completions"
OPENCODE_GO_MODEL = "glm-5.3-flash"

# secrets はここに書かない。デプロイ時に wrangler secret put で登録する:
#   GITHUB_TOKEN      GitHub fine-grained PAT（必須）
#   OPENCODE_GO_API_KEY OpenCode Go の API キー（任意。未設定なら AI 要約を使わず、抜粋で公開する）
