<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1f2d40" />
    <meta name="robots" content="noindex" />
    <title>Feed - 投稿</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="bar">
      <h1>Feed</h1>
      <a class="icon-button" href="https://slytxt.dev/feed/" aria-label="公開ページ" title="公開ページ">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7"/><path d="M8 7h9v9"/></svg>
      </a>
    </header>

    <main>
      <form id="composer" class="composer" novalidate>
        <label class="sr-only" for="body">本文</label>
        <textarea
          id="body"
          class="field composer__body"
          rows="4"
          maxlength="2000"
          required
        ></textarea>
        <p id="count" class="count">0 / 2000</p>

        <ul id="attachments" class="attachments"></ul>

        <div class="toolbar">
          <label class="icon-button" for="file" aria-label="画像を選ぶ" title="画像を選ぶ">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>
          </label>
          <input id="file" class="sr-only" type="file" accept="image/jpeg,image/png,image/gif,image/webp" />
          <p id="status" class="status" role="status" aria-live="polite"></p>
          <button id="submit" class="send-button" type="submit" aria-label="投稿する" title="投稿する" disabled>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
          </button>
        </div>
      </form>

      <section class="recent" aria-label="最近の投稿">
        <ol id="recent" class="recent__list"></ol>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
