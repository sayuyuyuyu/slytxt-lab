name = "slytxt-feed"
main = "src/index.mjs"
compatibility_date = "2025-06-01"

# 入口はカスタムドメイン（feed.slytxt.dev）のみ。Cloudflare Access で本人だけに
# 絞る前提なので、workers.dev は使わない。
workers_dev = false
routes = [{ pattern = "feed.slytxt.dev", custom_domain = true }]

# 投稿画面（PWA）の静的ファイル。
[assets]
directory = "./public"
binding = "ASSETS"

# 公開一覧（slytxt.dev/feed/）と同じ D1。`npx wrangler d1 create slytxt-feed`
# で作ったもの。バインディング名はコードが env.FEED を読むので FEED のままにする
# （Pages 側の D1 バインディングも FEED で揃える）。
[[d1_databases]]
binding = "FEED"
database_name = "slytxt-feed"
database_id = "570b8c9d-6ef3-4733-9de3-cf4b70f67c4f"

# 公開メディアの R2（writer / media Worker と共有）。フィードの画像は
# 最初から pub/ に置き、media.slytxt.dev から配信する。
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "slytxt-writer-media"
